<text x="62" y="164" fill="#F8FAFC" font-size="42" font-weight="600" font-family="Segoe UI,Helvetica,Arial,sans-serif">for School Dropout</text>
<text x="62" y="212" fill="#FDBA74" font-size="22" font-weight="400" font-family="Segoe UI,Helvetica,Arial,sans-serif">Which secondary schools are about to lose learners?</text>
