<text x="62" y="288" fill="#CBD5E1" font-size="17" font-weight="400" font-family="Segoe UI,Helvetica,Arial,sans-serif">Built only on open government data, school level, no learner records.</text>
<g transform="translate(626,56)"><rect width="196" height="214" rx="16" fill="#F8FAFC"/><rect width="196" height="44" rx="16" fill="#2563EB"/><rect y="28" width="196" height="16" fill="#2563EB"/><text x="16" y="29" fill="#ffffff" font-size="17" font-weight="700" font-family="Segoe UI,Helvetica,Arial,sans-serif">The data</text><text x="16" y="94" fill="#0F172A" font-size="38" font-weight="700" font-family="Segoe UI,Helvetica,Arial,sans-serif">478 761</text><text x="16" y="116" fill="#64748B" font-size="13" font-weight="400" font-family="Segoe UI,Helvetica,Arial,sans-serif">school-year rows</text><line x1="16" y1="132" x2="180" y2="132" stroke="#E2E8F0"/><text x="16" y="156" fill="#0F172A" font-size="14" font-weight="600" font-family="Segoe UI,Helvetica,Arial,sans-serif">9 provinces</text><text x="16" y="173" fill="#64748B" font-size="12.5" font-weight="400" font-family="Segoe UI,Helvetica,Arial,sans-serif">2007 to 2025</text><text x="16" y="197" fill="#64748B" font-size="12.5" font-weight="400" font-family="Segoe UI,Helvetica,Arial,sans-serif">13 exam reports parsed</text></g><g transform="translate(842,80)"><rect width="196" height="212" rx="16" fill="#F8FAFC"/><rect width="196" height="44" rx="16" fill="#F97316"/><rect y="28" width="196" height="16" fill="#F97316"/><text x="16" y="29" fill="#0F172A" font-size="17" font-weight="700" font-family="Segoe UI,Helvetica,Arial,sans-serif">Two tracks</text><text x="16" y="76" fill="#0F172A" font-size="14.5" font-weight="600" font-family="Segoe UI,Helvetica,Arial,sans-serif">Primary: 0.539</text><text x="16" y="93" fill="#64748B" font-size="12.5" font-weight="400" font-family="Segoe UI,Helvetica,Arial,sans-serif">leakage caught, dropped</text><line x1="16" y1="104" x2="180" y2="104" stroke="#E2E8F0"/><text x="16" y="126" fill="#0F172A" font-size="14.5" font-weight="600" font-family="Segoe UI,Helvetica,Arial,sans-serif">Independent: 0.654</text><text x="16" y="143" fill="#64748B" font-size="12.5" font-weight="400" font-family="Segoe UI,Helvetica,Arial,sans-serif">a working triage list</text><line x1="16" y1="154" x2="180" y2="154" stroke="#E2E8F0"/><text x="16" y="176" fill="#0F172A" font-size="14.5" font-weight="600" font-family="Segoe UI,Helvetica,Arial,sans-serif">Merged forest: 0.687</text><text x="16" y="193" fill="#64748B" font-size="12.5" font-weight="400" font-family="Segoe UI,Helvetica,Arial,sans-serif">test AUC, final model</text></g><g transform="translate(1058,56)"><rect width="196" height="214" rx="16" fill="#F8FAFC"/><rect width="196" height="44" rx="16" fill="#0B1F3A"/><rect y="28" width="196" height="16" fill="#0B1F3A"/><text x="16" y="29" fill="#ffffff" font-size="17" font-weight="700" font-family="Segoe UI,Helvetica,Arial,sans-serif">The result</text><text x="16" y="76" fill="#0F172A" font-size="13" font-weight="600" font-family="Segoe UI,Helvetica,Arial,sans-serif">Worst-scored tenth</text><rect x="16" y="84" width="162" height="18" rx="4" fill="#F97316"/><text x="16" y="124" fill="#64748B" font-size="13" font-weight="400" font-family="Segoe UI,Helvetica,Arial,sans-serif">25.2% lose learners</text><text x="16" y="150" fill="#0F172A" font-size="13" font-weight="600" font-family="Segoe UI,Helvetica,Arial,sans-serif">Best-scored tenth</text><rect x="16" y="158" width="11" height="18" rx="4" fill="#2563EB"/><text x="16" y="198" fill="#64748B" font-size="13" font-weight="400" font-family="Segoe UI,Helvetica,Arial,sans-serif">1.7% lose learners</text></g>
</svg>