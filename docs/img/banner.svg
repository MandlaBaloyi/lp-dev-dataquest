<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Early warning system for school dropout in South Africa: which secondary schools are about to lose learners">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1F3A"/><stop offset="1" stop-color="#14325C"/></linearGradient></defs>
<rect width="1280" height="340" rx="18" fill="url(#bg)"/>
<circle cx="1200" cy="20" r="170" fill="#F97316" opacity="0.10"/><circle cx="500" cy="345" r="140" fill="#2563EB" opacity="0.18"/>
