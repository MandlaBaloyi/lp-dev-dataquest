# Script-level config: applies when running
#   python -m streamlit run independent/app/streamlit_app.py
# and does not affect the EDA app in app/.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f3f2ee"
textColor = "#0b0b0b"
borderColor = "#e4e3df"
showWidgetBorder = true
baseRadius = "8px"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFontWeights = [700, 650, 600, 600, 600, 600]
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7", "#e34948"]
blueColor = "#2a78d6"
orangeColor = "#eb6834"
greenColor = "#1a7f37"
redColor = "#cf222e"
yellowColor = "#bf8700"

[theme.sidebar]
backgroundColor = "#f3f2ee"

[server]
headless = true

[browser]
gatherUsageStats = false
